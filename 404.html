<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Faqja nuk u gjet · ITCOM</title>
  <link rel="icon" href="/ITCOM/assets/favicon.svg" type="image/svg+xml" />
  <style>
    :root { --bg: #f5f6f7; --ink: #101114; --muted: #737882; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0c0d10; --ink: #f3f4f6; --muted: #8f949e; color-scheme: dark; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; }
    main { max-width: 420px; text-align: center; display: grid; gap: 14px; }
    h1 { font-size: 28px; margin: 0; letter-spacing: -0.02em; }
    p { margin: 0; color: var(--muted); }
    a { justify-self: center; margin-top: 8px; padding: 12px 22px; border-radius: 8px; background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>
  <main>
    <h1>Faqja nuk u gjet</h1>
    <p>Lidhja mund të jetë e vjetër ose e shkruar gabim.</p>
    <a href="/ITCOM/">Kthehu te dyqani</a>
  </main>
</body>
</html>
